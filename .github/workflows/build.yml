
name: LOCKZO Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build LOCKZO APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android Project
        run: flutter create --platforms=android --org com.lockzo.security --project-name lockzo .

      - name: Set Stable Android NDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "ndkVersion = flutter.ndkVersion",
              'ndkVersion = "27.2.12479018"'
          )
          p.write_text(s)
          PY

      - name: Install Android NDK
        run: |
          sdkmanager --licenses
          sdkmanager --install "ndk;27.2.12479018"

      - name: Fix Gradle Properties
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          EOF

      - name: Create local.properties
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate LOCKZO App Icon
        run: dart run flutter_launcher_icons

      - name: Clean XML Resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/app/src/main/res")
          for p in root.rglob("*.xml"):
              s = p.read_text(encoding="utf-8")
              s = re.sub(r'<\?xml\s+.*?\?>', '', s, flags=re.I | re.S)
              p.write_text(s.lstrip("\ufeff \t\r\n"), encoding="utf-8")
          PY

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LOCKZO-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
