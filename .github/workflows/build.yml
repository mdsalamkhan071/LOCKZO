
name: LOCKZO Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build LOCKZO APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter and Android SDK
        run: |
          flutter --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Generate Android Project
        run: |
          flutter create \
            --platforms=android \
            --org com.lockzo.security \
            --project-name lockzo .

      - name: Find SDK Manager
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Found SDK Manager: $SDKMANAGER"

      - name: Detect and Configure NDK
        run: |
          SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$SDK_ROOT/ndk"

          NDK_VERSION=$(find "$SDK_ROOT/ndk" \
            -mindepth 1 -maxdepth 1 -type d \
            -printf '%f\n' | sort -V | tail -n 1)

          if [ -z "$NDK_VERSION" ]; then
            echo "No installed NDK found. Installing NDK 27.2..."
            sdkmanager --install "ndk;27.2.12479018"
            NDK_VERSION="27.2.12479018"
          fi

          echo "Using NDK: $NDK_VERSION"

          python3 - "$NDK_VERSION" <<'PY'
          import sys
          import re
          from pathlib import Path

          version = sys.argv[1]
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'ndkVersion\s*=\s*.*',
              f'ndkVersion = "{version}"',
              s
          )

          p.write_text(s)
          print("Configured NDK:", version)
          PY

      - name: Fix Gradle Properties
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          EOF

      - name: Create Local Properties
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"

          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate LOCKZO App Icon
        run: dart run flutter_launcher_icons

      - name: Clean XML Resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/res")

          for p in root.rglob("*.xml"):
              s = p.read_text(encoding="utf-8")
              s = re.sub(
                  r'<\?xml\s+.*?\?>',
                  '',
                  s,
                  flags=re.I | re.S
              )
              p.write_text(
                  s.lstrip("\ufeff \t\r\n"),
                  encoding="utf-8"
              )
              print("Checked:", p)
          PY

      - name: Verify Build Configuration
        run: |
          echo "Gradle:"
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "App Gradle:"
          cat android/app/build.gradle.kts

          echo "Gradle Properties:"
          cat android/gradle.properties

          test -f assets/icon/lockzo_icon.png

      - name: Build LOCKZO APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload LOCKZO APK
        uses: actions/upload-artifact@v4
        with:
          name: LOCKZO-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
