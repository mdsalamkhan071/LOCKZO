
name: lockzo
description: LOCKZO Voice Lock and Security System.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/lockzo_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/lockzo_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#07152B"
  adaptive_icon_foreground: "assets/icon/lockzo_icon.png"
